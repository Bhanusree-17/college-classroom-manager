
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Classroom Manager</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #172554;
    color: white;
    padding: 25px;
}

header h1 {
    margin: 0 0 8px;
}

header p {
    margin: 0;
    color: #cbd5e1;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 25px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.card, .panel {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px #0000000a;
}

.card h3 {
    margin: 0;
    font-size: 15px;
    color: #64748b;
}

.card p {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 0;
}

.panel {
    margin-bottom: 25px;
}

form {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

input, select, button {
    padding: 12px;
    border-radius: 7px;
    font-size: 14px;
}

input, select {
    border: 1px solid #cbd5e1;
    width: 100%;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

#cancelEdit {
    background: #64748b;
}

.toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 15px;
}

.toolbar input {
    max-width: 450px;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 850px;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #e2e8f0;
}

th {
    background: #f8fafc;
}

.action-button {
    padding: 8px;
    margin: 2px;
}

.delete {
    background: #dc2626;
}

#message {
    margin-top: 15px;
}

#empty {
    color: #64748b;
}

@media (max-width: 650px) {
    .stats, form {
        grid-template-columns: 1fr;
    }

    main {
        padding: 12px;
    }

    .toolbar {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header>
<h1>MLR INSTITUTE OF TECHNOLOGY</h1>
    <h2>CSE-G CLASSROOM RECORDS</h2>
</header>

<main>

    <section class="stats">
        <div class="card">
            <h3>Total Students</h3>
            <p id="total">0</p>
        </div>

        <div class="card">
            <h3>Departments</h3>
            <p id="departments">0</p>
        </div>

        <div class="card">
            <h3>Average Attendance</h3>
            <p id="attendance">0%</p>
        </div>
    </section>

    <section class="panel">
        <h2 id="formTitle">Register a Student</h2>

        <form id="studentForm">
            <input name="studentId" placeholder="Student ID" required>
            <input name="name" placeholder="Full Name" required>
            <input name="rollNo" placeholder="Roll Number" required>
            <input name="department" placeholder="Department" required>

            <select name="year" required>
                <option value="">Select Year</option>
                <option value="1">First Year</option>
                <option value="2">Second Year</option>
                <option value="3">Third Year</option>
                <option value="4">Fourth Year</option>
            </select>

            <input name="section" placeholder="Section" required>
            <input name="email" type="email" placeholder="Email">
            <input name="phone" placeholder="Phone Number">

            <input
                name="attendance"
                type="number"
                min="0"
                max="100"
                value="0"
                placeholder="Attendance %"
                required
            >

            <button type="submit" id="submitButton">
                Add Student
            </button>

            <button type="button" id="cancelEdit" hidden>
                Cancel Edit
            </button>
        </form>

        <p id="message" role="status"></p>
    </section>

    <section class="panel">
        <h2>Student Records</h2>

        <div class="toolbar">
            <input
                id="search"
                placeholder="Search by name, ID, roll number..."
            >
            <button type="button" id="refresh">Refresh</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Roll Number</th>
                        <th>Department</th>
                        <th>Year</th>
                        <th>Section</th>
                        <th>Attendance</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentRows"></tbody>
            </table>
        </div>

        <p id="empty">No student records found.</p>
    </section>

</main>

<script>
const form = document.getElementById("studentForm");
const rows = document.getElementById("studentRows");
const message = document.getElementById("message");
const submitButton = document.getElementById("submitButton");
const cancelEditButton = document.getElementById("cancelEdit");

let students = [];
let editingId = null;

async function loadStudents() {
    try {
        const response = await fetch("/api/students");

        if (!response.ok) {
            throw new Error("Could not load students.");
        }

        students = await response.json();

        renderStudents();
        updateStatistics();

    } catch (error) {
        message.textContent =
            "Unable to connect to the backend. Check server.js.";
        message.style.color = "red";
    }
}

function updateStatistics() {
    document.getElementById("total").textContent =
        students.length;

    document.getElementById("departments").textContent =
        new Set(
            students.map(s => (s.department || "").toLowerCase())
        ).size;

    const average = students.length
        ? students.reduce(
            (sum, s) => sum + Number(s.attendance || 0), 0
          ) / students.length
        : 0;

    document.getElementById("attendance").textContent =
        average.toFixed(1) + "%";
}

function renderStudents() {
    const query = document.getElementById("search")
        .value.toLowerCase().trim();

    const filtered = students.filter(s =>
        [
            s.studentId,
            s.name,
            s.rollNo,
            s.department
        ].some(value =>
            String(value || "").toLowerCase().includes(query)
        )
    );

    rows.replaceChildren();

    document.getElementById("empty").textContent =
        filtered.length ? "" : "No student records found.";

    filtered.forEach(s => {
        const tr = document.createElement("tr");

        const values = [
            s.studentId,
            s.name,
            s.rollNo,
            s.department,
            "Year " + s.year,
            s.section,
            Number(s.attendance || 0) + "%"
        ];

        values.forEach(value => {
            const td = document.createElement("td");
            td.textContent = value ?? "";
            tr.appendChild(td);
        });

        const actionCell = document.createElement("td");

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.textContent = "Edit";
        editButton.className = "action-button";

        editButton.addEventListener("click", () => {
            editStudent(s);
        });

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.textContent = "Delete";
        deleteButton.className = "action-button delete";

        deleteButton.addEventListener("click", () => {
            deleteStudent(s.id);
        });

        actionCell.append(editButton, deleteButton);
        tr.appendChild(actionCell);

        rows.appendChild(tr);
    });
}

function editStudent(student) {
    editingId = student.id;

    form.elements.studentId.value = student.studentId ?? "";
    form.elements.name.value = student.name ?? "";
    form.elements.rollNo.value = student.rollNo ?? "";
    form.elements.department.value = student.department ?? "";
    form.elements.year.value = student.year ?? "";
    form.elements.section.value = student.section ?? "";
    form.elements.email.value = student.email ?? "";
    form.elements.phone.value = student.phone ?? "";
    form.elements.attendance.value = student.attendance ?? 0;

    document.getElementById("formTitle").textContent =
        "Edit Student";

    submitButton.textContent = "Save Changes";
    cancelEditButton.hidden = false;

    message.textContent =
        "Editing student: " + student.name;
    message.style.color = "blue";

    form.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}

function resetStudentForm() {
    form.reset();

    form.elements.attendance.value = 0;
    editingId = null;

    document.getElementById("formTitle").textContent =
        "Register a Student";

    submitButton.textContent = "Add Student";
    cancelEditButton.hidden = true;
}

cancelEditButton.addEventListener("click", () => {
    resetStudentForm();

    message.textContent = "Editing cancelled.";
    message.style.color = "#64748b";
});

form.addEventListener("submit", async event => {
    event.preventDefault();

    const data = Object.fromEntries(new FormData(form));

    data.year = Number(data.year);
    data.attendance = Number(data.attendance);

    const isEditing = editingId !== null;

    const url = isEditing
        ? "/api/students/" + editingId
        : "/api/students";

    const method = isEditing ? "PUT" : "POST";

    try {
        const response = await fetch(url, {
            method: method,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.error ||
                (isEditing
                    ? "Unable to update student."
                    : "Unable to add student.")
            );
        }

        message.textContent = isEditing
            ? "Student updated successfully!"
            : "Student added successfully!";

        message.style.color = "green";

        resetStudentForm();
        await loadStudents();

    } catch (error) {
        message.textContent = error.message;
        message.style.color = "red";
    }
});

async function deleteStudent(id) {
    if (!confirm("Do you want to delete this student?")) {
        return;
    }

    try {
        const response = await fetch("/api/students/" + id, {
            method: "DELETE"
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.error || "Unable to delete student."
            );
        }

        if (editingId === id) {
            resetStudentForm();
        }

        message.textContent = "Student deleted successfully!";
        message.style.color = "green";

        await loadStudents();

    } catch (error) {
        message.textContent = error.message;
        message.style.color = "red";
    }
}

document.getElementById("search")
    .addEventListener("input", renderStudents);

document.getElementById("refresh")
    .addEventListener("click", loadStudents);

loadStudents();
</script>

</body>
</html>
